# macOS-style shortcuts, surgically — everything unmapped passes through to niri.
# Combo note: the Wooting 60HE is remapped so the key next to space (Mac Command
# position) sends Super, and the one beside it (Mac Option position) sends Alt.
# Commented-out rules: Mac-style shortcuts given up for niri's Mod+W/A/S/D, Mod+C
# and Mod+V. Uncomment one to bring it back; xremap takes the key before niri sees
# it. The pre-WASD niri and xremap config is at git tag niri-before-wasd.

keymap:
  # ─── Browser: Mac-style tab shortcuts ───
  - name: mac-style browser
    exact_match: true # Super-Shift-c etc. pass through to niri instead of matching Super-c
    application:
      only: [helium, firefox]
    remap:
      Super-t: Ctrl-t             # new tab
      Super-Shift-t: Ctrl-Shift-t # reopen closed tab

  # ─── GUI apps: clipboard + deletion ───
  - name: mac clipboard and deletion (GUI apps)
    exact_match: true
    application:
      not: [com.mitchellh.ghostty]
    remap:
      # Super-a: Ctrl-a           # select all (niri: Mod+A focuses left)
      # Super-c: Ctrl-c           # copy (niri: Mod+C centers the window)
      # Super-v: Ctrl-v           # paste (niri: Mod+V floats the window)
      # Super-w: Ctrl-w           # close tab (niri: Mod+W focuses up)
      # Super-s: Ctrl-s           # save (niri: Mod+S focuses down)
      Alt-BackSpace: Ctrl-BackSpace              # delete word back
      Super-BackSpace: [Shift-Home, BackSpace]   # delete to line start

  # ─── Terminal: same finger memory, terminal dialect ───
  - name: mac clipboard and deletion (terminal)
    exact_match: true
    application:
      only: [com.mitchellh.ghostty]
    remap:
      # Super-a: Ctrl-Shift-a     # ghostty: select_all (niri: Mod+A focuses left)
      # Super-c: Ctrl-Shift-c     # ghostty: copy (niri: Mod+C centers the window)
      # Super-v: Ctrl-Shift-v     # ghostty: paste (niri: Mod+V floats the window)
      # Super-w: Ctrl-w           # ghostty: close_tab (niri: Mod+W focuses up)
      Super-BackSpace: Ctrl-u     # shell: delete to line start
      # Alt-BackSpace passes through: readline's native delete word back
